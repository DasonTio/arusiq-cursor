name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # eslint-plugin-jsx-a11y has not declared eslint 10 support yet; it works,
      # and this is the documented reason the flag is here.
      - run: npm ci --legacy-peer-deps
      - run: npm run verify
      - run: npm run format:check

  # Separate job: unbuilt Must requirements are the NORMAL state mid-sprint, so
  # this must never block a PR. It is the release gate.
  traceability:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run trace
